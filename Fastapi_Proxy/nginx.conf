server {
	listen 80 default_server;
	listen [::]:80 default_server;


	root /var/www/html;

	index index.html index.htm index.nginx-debian.html;

	server_name _;

location / {
                rewrite ^/.* / break;
                proxy_pass http://127.0.0.1:5000;
                proxy_set_header        Raw-URI $request_uri;
                proxy_set_header        Host $http_host;
    }


}